<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calle Tuning | Sistema de Inventario</title>
<style>
:root{
  --red:#d71920;
  --red-dark:#a90f15;
  --black:#111111;
  --black-2:#1b1b1b;
  --white:#ffffff;
  --gray:#f4f4f4;
  --gray-2:#e8e8e8;
  --text:#171717;
  --muted:#777;
  --shadow:0 8px 25px rgba(0,0,0,.10);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--gray);
  color:var(--text);
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:255px;
  background:var(--black);
  color:var(--white);
  position:fixed;
  inset:0 auto 0 0;
  display:flex;
  flex-direction:column;
  z-index:20;
  border-right:4px solid var(--red);
}
.brand{
  padding:24px 20px;
  border-bottom:1px solid #303030;
}
.brand h1{
  font-size:25px;
  letter-spacing:1.5px;
  font-weight:900;
}
.brand span{color:var(--red)}
.brand p{
  color:#bbb;
  font-size:11px;
  margin-top:5px;
  text-transform:uppercase;
  letter-spacing:1.2px;
}
.nav{
  padding:15px 12px;
  overflow:auto;
  flex:1;
}
.nav-title{
  color:#777;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1.4px;
  padding:12px 12px 7px;
  text-transform:uppercase;
}
.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#ddd;
  text-align:left;
  padding:12px 13px;
  margin:2px 0;
  border-radius:9px;
  transition:.2s;
}
.nav button:hover{background:#272727;color:white}
.nav button.active{
  background:var(--red);
  color:white;
  box-shadow:0 5px 15px rgba(215,25,32,.25);
}
.nav-icon{
  display:inline-block;
  width:25px;
  font-weight:bold;
}
.sidebar-footer{
  border-top:1px solid #303030;
  padding:15px 18px;
  color:#999;
  font-size:11px;
}

/* MAIN */
.main{
  margin-left:255px;
  width:calc(100% - 255px);
  min-width:0;
}
.topbar{
  height:72px;
  background:white;
  border-bottom:1px solid var(--gray-2);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:10;
}
.topbar-title h2{font-size:21px}
.topbar-title p{font-size:12px;color:var(--muted);margin-top:3px}
.user-box{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  font-weight:bold;
}
.user-avatar{
  width:37px;height:37px;border-radius:50%;
  background:var(--black);color:white;
  display:grid;place-items:center;
  border:2px solid var(--red);
}
.content{padding:28px 30px}

/* DASHBOARD */
.hero{
  background:var(--black);
  color:white;
  border-radius:var(--radius);
  padding:27px 30px;
  position:relative;
  overflow:hidden;
  margin-bottom:22px;
}
.hero:after{
  content:"";
  position:absolute;
  width:190px;height:190px;
  border:35px solid var(--red);
  border-radius:50%;
  right:-65px;top:-80px;
  opacity:.8;
}
.hero h1{font-size:27px;position:relative;z-index:1}
.hero p{color:#ccc;margin-top:8px;font-size:13px;position:relative;z-index:1}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:22px;
}
.stat{
  background:white;
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  border-left:5px solid var(--red);
}
.stat .label{font-size:12px;color:#777;text-transform:uppercase;font-weight:bold}
.stat .value{font-size:29px;font-weight:900;margin-top:8px}
.stat .small{font-size:11px;color:#888;margin-top:5px}
.panel{
  background:white;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:19px 21px;
  border-bottom:1px solid var(--gray-2);
}
.panel-head h3{font-size:16px}
.panel-body{padding:20px}

/* MODULE */
.module-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}
.module-title h2{font-size:23px}
.module-title p{font-size:12px;color:var(--muted);margin-top:5px}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  font-weight:bold;
  font-size:12px;
  transition:.2s;
}
.btn-primary{background:var(--red);color:white}
.btn-primary:hover{background:var(--red-dark);transform:translateY(-1px)}
.btn-dark{background:var(--black);color:white}
.btn-dark:hover{background:#2b2b2b}
.btn-light{background:white;border:1px solid var(--gray-2);color:var(--black)}
.btn-danger{background:var(--black);color:white}
.btn-danger:hover{background:var(--red)}
.search{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}
.search input{
  flex:1;
  padding:12px 14px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
}
.search input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(215,25,32,.08)}

/* TABLE */
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
thead{background:var(--black);color:white}
th{
  padding:13px 12px;
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.4px;
}
td{
  padding:13px 12px;
  border-bottom:1px solid #eee;
  font-size:12px;
  vertical-align:middle;
}
tbody tr:hover{background:#fafafa}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
}
.badge-red{background:#fbe3e4;color:#a90f15}
.badge-black{background:#e9e9e9;color:#111}
.row-actions{display:flex;gap:6px}
.row-actions button{
  border:0;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:bold;
}
.edit-btn{background:#eee;color:#111}
.delete-btn{background:#111;color:#fff}
.edit-btn:hover{background:#ddd}
.delete-btn:hover{background:var(--red)}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}
.modal.show{display:flex}
.modal-box{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-head{
  background:var(--black);
  color:white;
  padding:18px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:4px solid var(--red);
}
.modal-head h3{font-size:17px}
.close{
  border:0;background:transparent;color:white;font-size:25px;
}
.form{padding:22px}
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:bold;text-transform:uppercase;color:#555}
.field input,.field select,.field textarea{
  border:1px solid #ddd;
  border-radius:8px;
  padding:11px 12px;
  outline:none;
  background:white;
}
.field textarea{min-height:85px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(215,25,32,.08);
}
.form-footer{
  display:flex;justify-content:flex-end;gap:9px;
  margin-top:22px;padding-top:17px;
  border-top:1px solid #eee;
}

/* TOAST */
.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  background:var(--black);
  color:white;
  padding:14px 18px;
  border-radius:10px;
  box-shadow:var(--shadow);
  border-left:5px solid var(--red);
  transform:translateY(120px);
  opacity:0;
  transition:.25s;
  z-index:100;
  font-size:12px;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{border-left-color:var(--red)}

/* EMPTY */
.empty{text-align:center;padding:45px 20px;color:#888}
.empty strong{display:block;color:#222;margin-bottom:5px}

/* RESPONSIVE */
@media(max-width:950px){
  .sidebar{width:210px}
  .main{margin-left:210px;width:calc(100% - 210px)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  .sidebar{position:relative;width:100%;height:auto;border-right:0;border-bottom:4px solid var(--red)}
  .app{display:block}
  .main{margin-left:0;width:100%}
  .nav{max-height:300px}
  .topbar{padding:0 18px}
  .content{padding:18px}
  .module-head{align-items:flex-start;flex-direction:column}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="brand">
    <h1>CALLE <span>TUNING</span></h1>
    <p>Sistema de inventario</p>
  </div>

  <nav class="nav">
    <div class="nav-title">Principal</div>
    <button class="active" data-module="dashboard" onclick="mostrarModulo('dashboard')"><span class="nav-icon">◆</span> Dashboard</button>

    <div class="nav-title">Gestión</div>
    <button data-module="productos" onclick="mostrarModulo('productos')"><span class="nav-icon">▣</span> Productos</button>
    <button data-module="categorias" onclick="mostrarModulo('categorias')"><span class="nav-icon">▤</span> Categorías</button>
    <button data-module="marcas" onclick="mostrarModulo('marcas')"><span class="nav-icon">M</span> Marcas</button>
    <button data-module="proveedores" onclick="mostrarModulo('proveedores')"><span class="nav-icon">P</span> Proveedores</button>
    <button data-module="clientes" onclick="mostrarModulo('clientes')"><span class="nav-icon">C</span> Clientes</button>

    <div class="nav-title">Sistema</div>
    <button data-module="usuarios" onclick="mostrarModulo('usuarios')"><span class="nav-icon">U</span> Usuarios</button>
    <button data-module="roles" onclick="mostrarModulo('roles')"><span class="nav-icon">R</span> Roles</button>
    <button data-module="ventas" onclick="mostrarModulo('ventas')"><span class="nav-icon">$</span> Ventas</button>
    <button data-module="detalles-venta" onclick="mostrarModulo('detalles-venta')"><span class="nav-icon">D</span> Detalles de venta</button>
    <button data-module="movimientos-inventario" onclick="mostrarModulo('movimientos-inventario')"><span class="nav-icon">↕</span> Movimientos</button>
  </nav>

  <div class="sidebar-footer">Calle Tuning · Ayacucho</div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="topbar-title">
      <h2 id="topTitle">Dashboard</h2>
      <p>Administración de inventario y ventas</p>
    </div>
    <div class="user-box">
      <span>Administrador</span>
      <div class="user-avatar">A</div>
    </div>
  </header>

  <section class="content" id="appContent"></section>
</main>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Nuevo registro</h3>
      <button class="close" onclick="cerrarModal()">×</button>
    </div>
    <form class="form" id="dataForm"></form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "/api";
let currentModule = "dashboard";
let editingId = null;
let currentData = [];

const configs = {
  productos:{
    title:"Productos", endpoint:"productos", singular:"producto",
    fields:[
      ["nombre","Nombre","text",true],
      ["descripcion","Descripción","textarea",true],
      ["precio","Precio","number",true],
      ["stock","Stock","number",true],
      ["stockMinimo","Stock mínimo","number",true],
      ["estado","Estado","select",true, [["true","Activo"],["false","Inactivo"]]],
      ["categoria","Categoría","relation",true,"categorias"],
      ["marca","Marca","relation",true,"marcas"],
      ["proveedor","Proveedor","relation",true,"proveedores"]
    ],
    columns:["id","nombre","precio","stock","stockMinimo","estado"]
  },
  categorias:{
    title:"Categorías",endpoint:"categorias",singular:"categoría",
    fields:[["nombre","Nombre","text",true],["descripcion","Descripción","textarea",false]],
    columns:["id","nombre","descripcion"]
  },
  marcas:{
    title:"Marcas",endpoint:"marcas",singular:"marca",
    fields:[["nombre","Nombre","text",true]],
    columns:["id","nombre"]
  },
  proveedores:{
    title:"Proveedores",endpoint:"proveedores",singular:"proveedor",
    fields:[
      ["nombre","Nombre","text",true],
      ["telefono","Teléfono","text",true],
      ["email","Correo","email",true],
      ["direccion","Dirección","text",true]
    ],
    columns:["id","nombre","telefono","email","direccion"]
  },
  clientes:{
    title:"Clientes",endpoint:"clientes",singular:"cliente",
    fields:[
      ["nombre","Nombre","text",true],
      ["apellido","Apellido","text",true],
      ["documento","Documento","text",true],
      ["telefono","Teléfono","text",true],
      ["email","Correo","email",true]
    ],
    columns:["id","nombre","apellido","documento","telefono","email"]
  },
  roles:{
    title:"Roles",endpoint:"roles",singular:"rol",
    fields:[["nombre","Nombre","text",true]],
    columns:["id","nombre"]
  },
  usuarios:{
    title:"Usuarios",endpoint:"usuarios",singular:"usuario",
    fields:[
      ["nombre","Nombre","text",true],
      ["apellido","Apellido","text",true],
      ["username","Usuario","text",true],
      ["password","Contraseña","text",true],
      ["estado","Estado","select",true,[["true","Activo"],["false","Inactivo"]]],
      ["rol","Rol","relation",true,"roles"]
    ],
    columns:["id","nombre","apellido","username","estado"]
  },
  ventas:{
    title:"Ventas",endpoint:"ventas",singular:"venta",
    fields:[
      ["fecha","Fecha","datetime",true],
      ["total","Total","number",true],
      ["cliente","Cliente","relation",true,"clientes"],
      ["usuario","Usuario","relation",true,"usuarios"]
    ],
    columns:["id","fecha","total","cliente","usuario"]
  },
  "detalles-venta":{
    title:"Detalles de venta",endpoint:"detalles-venta",singular:"detalle de venta",
    fields:[
      ["cantidad","Cantidad","number",true],
      ["precioUnitario","Precio unitario","number",true],
      ["subtotal","Subtotal","number",true],
      ["venta","Venta","relation",true,"ventas"],
      ["producto","Producto","relation",true,"productos"]
    ],
    columns:["id","cantidad","precioUnitario","subtotal","venta","producto"]
  },
  "movimientos-inventario":{
    title:"Movimientos de inventario",endpoint:"movimientos-inventario",singular:"movimiento",
    fields:[
      ["tipoMovimiento","Tipo de movimiento","select",true,[["ENTRADA","Entrada"],["SALIDA","Salida"]]],
      ["cantidad","Cantidad","number",true],
      ["fecha","Fecha","datetime",true],
      ["motivo","Motivo","text",true],
      ["producto","Producto","relation",true,"productos"],
      ["usuario","Usuario","relation",true,"usuarios"]
    ],
    columns:["id","tipoMovimiento","cantidad","fecha","motivo","producto","usuario"]
  }
};

function escapeHtml(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function mostrarModulo(module){
  currentModule=module;
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  const btn=document.querySelector(`.nav button[data-module="${module}"]`);
  if(btn) btn.classList.add("active");

  if(module==="dashboard"){
    document.getElementById("topTitle").textContent="Dashboard";
    renderDashboard();
  }else{
    document.getElementById("topTitle").textContent=configs[module].title;
    cargarModulo(module);
  }
}

async function getJSON(url){
  const res=await fetch(url);
  if(!res.ok) throw new Error("Error HTTP "+res.status);
  return await res.json();
}

async function renderDashboard(){
  const content=document.getElementById("appContent");
  content.innerHTML=`
    <div class="hero">
      <h1>Bienvenido a Calle Tuning</h1>
      <p>Control centralizado de productos, inventario, clientes y ventas.</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="label">Productos</div><div class="value" id="stProducts">—</div><div class="small">Registrados en PostgreSQL</div></div>
      <div class="stat"><div class="label">Stock total</div><div class="value" id="stStock">—</div><div class="small">Unidades disponibles</div></div>
      <div class="stat"><div class="label">Clientes</div><div class="value" id="stClients">—</div><div class="small">Clientes registrados</div></div>
      <div class="stat"><div class="label">Ventas</div><div class="value" id="stSales">—</div><div class="small">Ventas registradas</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Resumen del sistema</h3><button class="btn btn-primary" onclick="mostrarModulo('productos')">Gestionar productos</button></div>
      <div class="panel-body"><p style="font-size:13px;color:#666">Los datos mostrados se consultan directamente desde la API de Spring Boot y PostgreSQL.</p></div>
    </div>
  `;

  try{
    const [products,clients,sales]=await Promise.all([
      getJSON(API+"/productos"),getJSON(API+"/clientes"),getJSON(API+"/ventas")
    ]);
    document.getElementById("stProducts").textContent=products.length;
    document.getElementById("stStock").textContent=products.reduce((s,p)=>s+(Number(p.stock)||0),0);
    document.getElementById("stClients").textContent=clients.length;
    document.getElementById("stSales").textContent=sales.length;
  }catch(e){
    document.getElementById("stProducts").textContent="!";
    document.getElementById("stStock").textContent="!";
    document.getElementById("stClients").textContent="!";
    document.getElementById("stSales").textContent="!";
    toast("No se pudo conectar con el backend",true);
  }
}

async function cargarModulo(module){
  const cfg=configs[module];
  const content=document.getElementById("appContent");
  content.innerHTML=`
    <div class="module-head">
      <div class="module-title">
        <h2>${cfg.title}</h2>
        <p>Administración y mantenimiento de ${cfg.singular}s.</p>
      </div>
      <div class="actions">
        <button class="btn btn-dark" onclick="cargarModulo('${module}')">Actualizar</button>
        <button class="btn btn-primary" onclick="abrirNuevo()">+ Añadir ${cfg.singular}</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-body">
        <div class="search">
          <input id="searchInput" placeholder="Buscar en ${cfg.title.toLowerCase()}..." oninput="filtrarTabla()">
        </div>
        <div class="table-wrap" id="tableArea"><div class="empty">Cargando datos...</div></div>
      </div>
    </div>
  `;

  try{
    currentData=await getJSON(API+"/"+cfg.endpoint);
    renderTable(currentData);
  }catch(e){
    document.getElementById("tableArea").innerHTML=`<div class="empty"><strong>No se pudo cargar la información</strong>Verifica que Spring Boot esté ejecutándose en http://localhost:8080</div>`;
    toast("Error al cargar "+cfg.title,true);
  }
}

function getRelationValue(obj){
  if(!obj) return "—";
  if(typeof obj==="object") return obj.nombre || obj.username || obj.id || "—";
  return obj;
}

function cellValue(item,key){
  let value=item[key];
  if(key==="cliente"||key==="usuario"||key==="rol"||key==="categoria"||key==="marca"||key==="proveedor"||key==="venta"||key==="producto"){
    return getRelationValue(value);
  }
  if(key==="estado"){
    return value
      ? '<span class="badge badge-red">ACTIVO</span>'
      : '<span class="badge badge-black">INACTIVO</span>';
  }
  if(key==="tipoMovimiento"){
    return value==="ENTRADA"
      ? '<span class="badge badge-red">ENTRADA</span>'
      : '<span class="badge badge-black">SALIDA</span>';
  }
  if(key==="precio"||key==="total"||key==="precioUnitario"||key==="subtotal"){
    return value==null?"—":"S/ "+Number(value).toFixed(2);
  }
  if(key==="fecha" && value) return escapeHtml(String(value).replace("T"," "));
  return value==null||value===""?"—":escapeHtml(value);
}

function columnTitle(key){
  const map={
    id:"ID",nombre:"Nombre",apellido:"Apellido",username:"Usuario",
    precio:"Precio",stock:"Stock",stockMinimo:"Stock mínimo",estado:"Estado",
    descripcion:"Descripción",telefono:"Teléfono",email:"Correo",direccion:"Dirección",
    documento:"Documento",fecha:"Fecha",total:"Total",cantidad:"Cantidad",
    precioUnitario:"Precio unitario",subtotal:"Subtotal",tipoMovimiento:"Tipo",
    motivo:"Motivo",cliente:"Cliente",usuario:"Usuario",rol:"Rol",
    categoria:"Categoría",marca:"Marca",proveedor:"Proveedor",
    venta:"Venta",producto:"Producto"
  };
  return map[key]||key;
}

function renderTable(data){
  const cfg=configs[currentModule];
  const area=document.getElementById("tableArea");
  if(!data.length){
    area.innerHTML=`<div class="empty"><strong>No hay registros</strong>Agrega el primer ${cfg.singular} usando el botón Añadir.</div>`;
    return;
  }
  area.innerHTML=`
    <table>
      <thead><tr>
        ${cfg.columns.map(c=>`<th>${columnTitle(c)}</th>`).join("")}
        <th>Acciones</th>
      </tr></thead>
      <tbody>
        ${data.map(item=>`
          <tr data-search="${escapeHtml(JSON.stringify(item))}">
            ${cfg.columns.map(c=>`<td>${cellValue(item,c)}</td>`).join("")}
            <td>
              <div class="row-actions">
                <button class="edit-btn" onclick="editar(${item.id})">Editar</button>
                <button class="delete-btn" onclick="eliminar(${item.id})">Eliminar</button>
              </div>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function filtrarTabla(){
  const q=(document.getElementById("searchInput")?.value||"").toLowerCase();
  document.querySelectorAll("#tableArea tbody tr").forEach(row=>{
    row.style.display=row.dataset.search.toLowerCase().includes(q)?"":"none";
  });
}

async function abrirNuevo(){
  editingId=null;
  await abrirFormulario(null);
}

async function editar(id){
  try{
    const item=await getJSON(API+"/"+configs[currentModule].endpoint+"/"+id);
    editingId=id;
    await abrirFormulario(item);
  }catch(e){toast("No se pudo obtener el registro",true)}
}

function relationId(value){
  if(value && typeof value==="object") return value.id ?? "";
  return value ?? "";
}

function formatDateTime(value){
  if(!value) return "";
  return String(value).slice(0,16);
}

async function abrirFormulario(item){
  const cfg=configs[currentModule];
  document.getElementById("modalTitle").textContent=
    editingId ? "Editar "+cfg.singular : "Nuevo "+cfg.singular;

  let html='<div class="form-grid">';

  for(const f of cfg.fields){
    const [key,label,type,required,extra]=f;
    let value=item ? item[key] : "";
    if(type==="relation") value=relationId(value);
    if(type==="datetime") value=formatDateTime(value);

    html+=`<div class="field ${type==="textarea"?"full":""}">
      <label>${label}</label>`;

    if(type==="textarea"){
      html+=`<textarea name="${key}" ${required?"required":""}>${escapeHtml(value)}</textarea>`;
    }else if(type==="select"){
      html+=`<select name="${key}" ${required?"required":""}>
        ${extra.map(o=>`<option value="${o[0]}" ${String(value)===o[0]?"selected":""}>${o[1]}</option>`).join("")}
      </select>`;
    }else if(type==="relation"){
      html+=`<select name="${key}" data-relation="${extra}" ${required?"required":""}>
        <option value="">Cargando...</option>
      </select>`;
    }else{
      html+=`<input name="${key}" type="${type}" value="${escapeHtml(value)}" ${required?"required":""} ${type==="number"?'step="0.01"':""}>`;
    }
    html+="</div>";
  }

  html+=`</div>
    <div class="form-footer">
      <button type="button" class="btn btn-light" onclick="cerrarModal()">Cancelar</button>
      <button type="submit" class="btn btn-primary">${editingId?"Guardar cambios":"Registrar"}</button>
    </div>`;

  const form=document.getElementById("dataForm");
  form.innerHTML=html;
  document.getElementById("modal").classList.add("show");

  for(const select of form.querySelectorAll("select[data-relation]")){
    await cargarRelacion(select,select.dataset.relation);
    if(item){
      const original=relationId(item[select.name]);
      select.value=original;
    }
  }

  form.onsubmit=guardarFormulario;
}

async function cargarRelacion(select,endpoint){
  try{
    const data=await getJSON(API+"/"+endpoint);
    select.innerHTML='<option value="">Seleccione...</option>'+
      data.map(x=>{
        const text=x.nombre || x.username || ("ID "+x.id);
        return `<option value="${x.id}">${escapeHtml(text)}</option>`;
      }).join("");
  }catch(e){
    select.innerHTML='<option value="">No disponible</option>';
  }
}

async function guardarFormulario(ev){
  ev.preventDefault();
  const cfg=configs[currentModule];
  const form=new FormData(ev.target);
  const body={};

  for(const f of cfg.fields){
    const [key,label,type]=f;
    let value=form.get(key);

    if(type==="number"){
      value=value===""?null:Number(value);
    }else if(type==="select" && (value==="true"||value==="false")){
      value=value==="true";
    }else if(type==="relation"){
      value=value===""?null:{id:Number(value)};
    }
    body[key]=value;
  }

  try{
    const url=API+"/"+cfg.endpoint+(editingId?"/"+editingId:"");
    const res=await fetch(url,{
      method:editingId?"PUT":"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });

    if(!res.ok){
      const txt=await res.text();
      throw new Error(txt || "Error HTTP "+res.status);
    }

    cerrarModal();
    toast(editingId ? "Registro actualizado correctamente" : "Registro creado correctamente");
    await cargarModulo(currentModule);
  }catch(e){
    console.error(e);
    toast("No se pudo guardar el registro",true);
  }
}

async function eliminar(id){
  const cfg=configs[currentModule];
  if(!confirm(`¿Eliminar este ${cfg.singular}? Esta acción no se puede deshacer.`)) return;

  try{
    const res=await fetch(API+"/"+cfg.endpoint+"/"+id,{method:"DELETE"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    toast("Registro eliminado correctamente");
    await cargarModulo(currentModule);
  }catch(e){
    toast("No se pudo eliminar. Puede tener relaciones asociadas.",true);
  }
}

function cerrarModal(){
  document.getElementById("modal").classList.remove("show");
  editingId=null;
}

function toast(message,error=false){
  const t=document.getElementById("toast");
  t.textContent=message;
  t.className="toast show"+(error?" error":"");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.classList.remove("show"),3000);
}

document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal") cerrarModal();
});

renderDashboard();
</script>
</body>
</html>
